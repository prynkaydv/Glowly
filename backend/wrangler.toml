name = "glowly-api"
main = "worker.py"
compatibility_date = "2026-10-29"
compatibility_flags = ["python_workers"]
find_additional_modules = true
base_dir = "static"
preserve_file_names = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "glowly-db"
database_id = "175d0dd5-d05f-4c3e-a353-79792025a7cf"
migrations_dir = "migrations"
