services:
  - type: web
    name: glowly-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: SERPAPI_API_KEY
        sync: false
      - key: SERPAPI_GL
        value: in
      - key: SERPAPI_HL
        value: en
      - key: SERPAPI_CURRENCY
        value: INR
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: DATABASE_PATH
        value: ./glowly.db


